name: Build e Release do Rodam

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    name: Build para ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            TARGET_OS: Linux
            ARTIFACT_EXT: .deb  # Mudamos para .deb
          - os: windows-latest
            TARGET_OS: Windows
            ARTIFACT_EXT: .exe
          - os: macos-13 # Atualizado para macos-13 (Ventura) pois macos-12 foi descontinuado. Mantém Intel (x86_64).
            TARGET_OS: MacOS
            ARTIFACT_EXT: .dmg

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      # --- 0. EXTRAIR VERSÃO (Remove o 'v') ---
      - name: Extrair Versão Limpa
        shell: bash
        run: |
          VERSION_TAG=${{ github.ref_name }}
          CLEAN_VERSION=${VERSION_TAG#v}
          echo "APP_VERSION=$CLEAN_VERSION" >> $GITHUB_ENV
          echo "Versão detectada: $CLEAN_VERSION"

      # --- LIMPEZA DE ESPAÇO (LINUX) ---
      - name: Free Disk Space (Linux)
        if: runner.os == 'Linux'
        run: |
          # Remove huge unnecessary tools
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          
          # Clean Docker and Apt
          sudo docker image prune --all --force || true
          sudo apt-get clean
          
          # Show available space
          df -h

      # --- DEPENDÊNCIAS ---
      - name: Instalar Deps Linux
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository universe
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            build-essential \
            binutils \
            libssl-dev \
            libffi-dev \
            python3-dev \
            python3-setuptools \
            libgirepository1.0-dev \
            libcairo2-dev \
            pkg-config \
            python3-tk

          # Instalar FPM (para criar o .deb)
          sudo gem install fpm

      - name: Instalar Python Requirements
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          
          # TRUQUE: Remover torch do requirements.txt para evitar baixar a versão GIGANTE com CUDA (GPU)
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            sed -i '' '/torch==/d' requirements.txt
          else
            sed -i '/torch==/d' requirements.txt
          fi
          
          # Instala versão CPU leve do PyTorch
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          
          # Instala o resto
          pip install -r requirements.txt
          pip install pyinstaller Pillow

      # --- BUILD PYINSTALLER (Comum a todos) ---
      # Nota: Adicionei --windowed para não abrir terminal preto no Windows
      - name: Build com PyInstaller
        shell: bash
        run: |
          PYINSTALLER_ARGS=""
          # Desabilita Splash no MacOS e define arquitetura Intel (x86_64)
          if [[ "${{ runner.os }}" == "macOS" ]]; then
             # 1. Ajuste do .spec para Splash
             sed -i '' '/^splash = Splash(/,/^)/ s/^/# /' Rodam.spec
             sed -i '' 's/^# splash = Splash(/splash = None # splash = Splash(/' Rodam.spec
             sed -i '' 's/splash,/# splash,/' Rodam.spec
             sed -i '' 's/splash.binaries,/# splash.binaries,/' Rodam.spec
             
             # 2. Forçar arquitetura x86_64
             PYINSTALLER_ARGS="--target-arch x86_64"
          fi
          
          pyinstaller Rodam.spec $PYINSTALLER_ARGS

      # ========================================================
      # 1. WINDOWS: INNO SETUP
      # ========================================================
      - name: Criar Instalador Windows (Inno Setup)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          choco install innosetup
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss /DMyAppVersion="${{ env.APP_VERSION }}"

      # O Inno Setup (configurado acima) já deve salvar em dist/Rodam-Setup-Windows-X.X.exe

      # ========================================================
      # 2. LINUX: FPM (.deb)
      # ========================================================
      - name: Empacotar Linux (.deb)
        if: runner.os == 'Linux'
        run: |
          # 1. Criar estrutura de pastas temporária
          mkdir -p build_pkg/usr/bin
          mkdir -p build_pkg/usr/share/applications
          mkdir -p build_pkg/usr/share/icons/hicolor/256x256/apps/
          
          # 2. Copiar binário
          cp dist/Rodam build_pkg/usr/bin/rodam
          chmod +x build_pkg/usr/bin/rodam
          
          # 3. Copiar atalho (.desktop) e ícone
          # Assumindo que você criou o rodam.desktop na raiz
          cp rodam.desktop build_pkg/usr/share/applications/
          
          # Copiar ícone (resources/icon.png -> rodam.png)
          cp resources/icon.png build_pkg/usr/share/icons/hicolor/256x256/apps/rodam.png

          # 4. Rodar FPM com diretório temporário local (evita erro de espaço em /tmp)
          export TMPDIR=$(pwd)/fpm_tmp
          mkdir -p $TMPDIR
          
          fpm --workdir $TMPDIR -s dir -t deb \
            -n "rodam" \
            -v "${{ env.APP_VERSION }}" \
            -C build_pkg \
            -p dist/Rodam-Linux-${{ env.APP_VERSION }}.deb \
            --description "Interface FastAPI Rodam" \
            --maintainer "Seu Nome <email@exemplo.com>" \
            usr/

      # ========================================================
      # 3. MACOS: CREATE-DMG
      # ========================================================
      - name: Criar DMG MacOS
        if: runner.os == 'macOS'
        run: |
          # Usamos uma action ou brew para instalar create-dmg mais robusto
          brew install create-dmg

          # Se tiver ícone .icns, certifique-se que o PyInstaller usou ele no .spec
          # Ou copie manualmente para o .app se necessário

          # Cria a pasta de release limpa
          mkdir -p dist_dmg
          
          create-dmg \
            --volname "Instalador Rodam" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --app-drop-link 600 185 \
            "dist/Rodam-MacOS-${{ env.APP_VERSION }}.dmg" \
            "dist/Rodam.app"

      # --- PUBLICAR ---
      - name: Publicar Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Versão ${{ env.APP_VERSION }}
          fail_on_unmatched_files: false
          files: |
            dist/*.exe
            dist/*.deb
            dist/*.dmg
