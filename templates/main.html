<!DOCTYPE html>
<html lang="pt-br">

<head>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Mermaid JS -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@100;300;400;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.1/dist/jquery.min.js"></script>

<body>
    <div class="container-fluid p-0">
        <nav class="navbar navbar-expand-lg navbar-light bg-primary">
            <!-- Navbar Content Preserved -->
            <div class="container-fluid">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">

                        <li class="nav-item bg-primary">
                            <a class="nav-link navinactive" href="/?p=indexToc" title="Voltar ao Início">
                                <i class="bi bi-house-door-fill text-white"></i>
                            </a>
                        </li>

                        {% for item in nav_items %}
                        <li class="nav-item bg-primary">
                            <a class="nav-link {{ 'active navactive' if current_page == item.id else 'navinactive' }}"
                                aria-current="{{ 'page' if current_page == item.id else 'false' }}"
                                href="{{ item.href }}">
                                {{ item.label }}
                            </a>
                        </li>
                        {% endfor %}

                        <li class="nav-item">
                            <span class="navbar-brand mx-3 titulo">Estudos sobre "O Livro de Urântia"</span>
                        </li>

                        <div class="trackCombo">
                            <div class="trackCombo-input-wrapper">
                                <input type="text" class="trackCombo-input" id="mytrackCombo" autocomplete="off"
                                    placeholder="Ir para ex: 1:2.3">
                                <button class="trackCombo-button" id="mytrackComboButton"></button>
                            </div>
                            <div class="trackCombo-options" id="mytrackComboOptions"></div>
                        </div>

                    </ul>

                    <div class="small-text-container">
                        <p class="small-text">Texto PT-BR atualizado em: 05/09/2025</p>
                    </div>

                    <div class="navbar-nav ms-auto">
                        <button class="btn btn-primary" onclick="window.print()"
                            title="Imprime o texto do documento selecionado.">Imprimir</button>
                        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#myModal"
                            title="Clique para entender o significado das cores de fundo de cada parágrafo.">Cores</button>
                    </div>

                </div>
            </div>
        </nav>

        <div class="main-row">
            <div id="leftColumn">
            </div>

            <div id="divisor"></div>

            <div id="rightColumn">
            </div>
        </div>
    </div>

    <!-- Modals (Preserved) -->
    <!-- Colors Modal -->
    <div class="modal fade" id="colorsModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Definição de Cores</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>Aqui você poderá configurar as cores da interface (Em breve).</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                    <button type="button" class="btn btn-primary">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Search Results Modal (Included from Template) -->
    {% include 'search_modal.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
        crossorigin="anonymous"></script>

    <!-- Local JS -->
    <script src="js/tub_pt_br.js"></script>
    <script src="js/indexToc.js"></script> <!-- Assuming this handles ToC population -->
    <script src="js/combotrack.js"></script>

    <script>
        // Init logic based on 'p' parameter
        document.addEventListener('DOMContentLoaded', () => {
            // Resizer Logic
            const divisor = document.getElementById('divisor');
            const leftColumn = document.getElementById('leftColumn');
            const rightColumn = document.getElementById('rightColumn');
            const container = document.querySelector('.main-row'); // Parent flex container

            let isResizing = false;

            divisor.addEventListener('mousedown', (e) => {
                isResizing = true;
                divisor.classList.add('resizing');
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none'; // Disable text selection during drag
            });

            document.addEventListener('mousemove', (e) => {
                if (!isResizing) return;

                // Calculate new width relative to container
                const containerRect = container.getBoundingClientRect();
                const containerLeft = containerRect.left;

                // Current Mouse X relative to container
                let pointerRelativeXpos = e.clientX - containerLeft;

                // Constrain minimum widths (e.g., 100px)
                const minWidth = 100;
                const maxWidth = containerRect.width - 100;

                if (pointerRelativeXpos < minWidth) pointerRelativeXpos = minWidth;
                if (pointerRelativeXpos > maxWidth) pointerRelativeXpos = maxWidth;

                // Set left width (Flexbox will adjust right automatically via flex-grow)
                leftColumn.style.width = `${pointerRelativeXpos}px`;
                leftColumn.style.flex = `0 0 ${pointerRelativeXpos}px`; // Fix flex properties
            });

            document.addEventListener('mouseup', () => {
                if (isResizing) {
                    isResizing = false;
                    divisor.classList.remove('resizing');
                    document.body.style.cursor = 'default';
                    document.body.style.userSelect = 'auto';
                }
            });
        });

        async function loadContent(route) {
            try {
                const response = await fetch(route);
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();

                const leftDiv = document.getElementById('leftColumn');
                const rightDiv = document.getElementById('rightColumn');

                if (leftDiv) leftDiv.innerHTML = data.left;
                if (rightDiv) rightDiv.innerHTML = data.right;

                // Update active state in navbar
                document.querySelectorAll('.nav-link').forEach(link => {
                    link.classList.remove('active', 'navactive');
                    link.classList.add('navinactive');
                    // Simple check if href matches
                    if (link.getAttribute('href') === `javascript:loadContent('${route}')`) {
                        link.classList.add('active', 'navactive');
                        link.classList.remove('navinactive');
                    }
                });

            } catch (error) {
                console.error('Error loading content:', error);
                document.getElementById('rightColumn').innerHTML = `<p class="text-danger">Erro ao carregar conteúdo: ${error.message}</p>`;
            }
        }
    </script>
</body>

</html>
