<html lang="en" data-bs-theme="dark">

<head>

    <link rel="icon" href="/favicon.ico">

    <style>
        @media print {

            /* Hide Navigation, Left Column, Splitter, and Modals */
            nav,
            #leftColumn,
            #divisor,
            .modal,
            .trackCombo-options {
                display: none !important;
            }

            /* Reset container constraints to allow full-page printing */
            html,
            body,
            .container-fluid,
            .main-row {
                width: 100% !important;
                height: auto !important;
                margin: 0 !important;
                padding: 0 !important;
                overflow: visible !important;
                display: block !important;
            }

            /* Force Right Column to expand and show all content */
            #rightColumn {
                width: 100% !important;
                height: auto !important;
                flex: none !important;
                overflow: visible !important;
                display: block !important;
                border: none !important;
            }

            /* Ensure proper contrast for printing (Force Light Mode-like appearance) */
            body {
                background-color: white !important;
                color: black !important;
            }

            /* Optional: Preserve highlighting if needed, but ensure readable text */
            #rightColumn * {
                color: black;
                /* Default to black, specific styles can override */
            }

            /* Preserve specific text colors if they have !important (like search term highlights) */

            @page {
                size: auto;
                margin: 2cm;
            }
        }

        /* Search Highlight Style */
        .search-highlight {
            background-color: var(--highlight-color, magenta);
            color: black !important;
            font-weight: bold;
            border-radius: 2px;
            padding: 0 2px;
        }
    </style>
</head>

<body>
    <div class="container-fluid p-0">
        <nav class="navbar navbar-expand-lg navbar-light bg-primary">
            <!-- Navbar Content Preserved -->
            <div class="container-fluid">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"

                <div class="collapse navbar-collapse" id="navbarNav">

                                <label class="form-check-label" for="hlGold"
                                    style="background-color: var(--bs-body-bg); color: var(--bs-body-color); padding: 2px 5px; border-radius: 4px;">
                                    Texto normal com <span style="font-weight: bold; color: gold;">Destaque</span>
                                </label>

                                <input class="form-check-input" type="radio" name="highlightColor" id="hlCyan"

    <!-- Search Results Modal (Included from Template) -->
    {% include 'search_modal.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
        crossorigin="anonymous"></script>

    <!-- Local JS -->
    <!-- 
    <script src="js/tub_pt_br.js"></script>
    <script src="js/combotrack.js"></script> 
    <script src="js/indexToc.js"></script>
-->

    <script>
        // --- Init Configuration from Server ---
        const savedHighlight = "{{ config.HighlightColor }}";
        const savedDarkMode = {{ "true" if config.DarkMode else "false" }};
        const savedShowBg = {{ "true" if config.ShowBgColors else "false" }};

        // Load Initial Recent Paragraphs from Config
        let recentParagraphs = {{ config.RecentParagraphs | tojson }};

        // --- Search Highlight Logic ---
        let currentSearchTerm = "{{ config.query | default('') }}"; // Initialize if possible
        let isHighlightingEnabled = localStorage.getItem('isHighlightingEnabled') === 'true'; // Default off unless saved

        function toggleHighlight() {
            isHighlightingEnabled = !isHighlightingEnabled;
            localStorage.setItem('isHighlightingEnabled', isHighlightingEnabled);

            updateHighlightButtonState();

            if (isHighlightingEnabled) {
                applyHighlightState();
            } else {
                cleanHighlights();
            }
        }

        function updateHighlightButtonState() {
            const btn = document.getElementById('btnHighlight');
            if (isHighlightingEnabled) {
                btn.classList.remove('btn-outline-warning');
                btn.classList.add('btn-warning');
            } else {
                btn.classList.remove('btn-warning');
                btn.classList.add('btn-outline-warning');
            }
        }

        function applyHighlightState() {
            if (isHighlightingEnabled && currentSearchTerm) {
                const terms = extractSearchTerms(currentSearchTerm);
                if (terms.length > 0) {
                    highlightTerms(terms);
                } else {
                    cleanHighlights();
                }
            } else {
                cleanHighlights();
            }
        }

        // New Helper: Extracts relevant terms from Whoosh query syntax
        function extractSearchTerms(query) {
            if (!query) return [];
            console.log("Extracting terms from:", query);

            // 1. Remove standard boolean operators
            let cleaned = query.replace(/\b(AND|OR|NOT)\b/gi, ' ');

            // 2. Remove special syntax characters
            cleaned = cleaned.replace(/[\(\)\+\-\:\^\~\[\]\{\}\!\*\?]/g, ' ');

            // 3. Handle Phrases in Quotes
            const phrases = [];
            cleaned = cleaned.replace(/"([^"]+)"/g, (m, p1) => {
                if (p1 && p1.trim().length > 0) phrases.push(p1.trim());
                return ' ';
            });

            // 4. Split remaining text
            const words = cleaned.split(/\s+/).filter(w => w.trim().length > 2);

            const allTerms = [...phrases, ...words];
            console.log("Extracted terms:", allTerms);
            return allTerms;
        }

        function highlightTerms(terms) {
            cleanHighlights(); // Clean first
            if (!terms || terms.length === 0) return;

            const rightColumn = document.getElementById('rightColumn');
            if (!rightColumn) return;

            // Create a single composite Regex
            const escapedTerms = terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
            const pattern = `(${escapedTerms.join('|')})`;
            const regex = new RegExp(pattern, 'gi');

            console.log("Composite Highlight Regex:", regex);

            function traverse(node) {
                if (node.nodeType === 3) { // Text Node
                    const text = node.nodeValue;
                    if (regex.test(text)) {
                        const fragment = document.createDocumentFragment();
                        let lastIdx = 0;
                        text.replace(regex, (match, p1, offset) => {
                            const before = text.slice(lastIdx, offset);
                            if (before.length > 0) fragment.appendChild(document.createTextNode(before));

                            const span = document.createElement('span');
                            span.className = 'search-highlight';
                            span.textContent = match;
                            fragment.appendChild(span);

                            lastIdx = offset + match.length;
                            return match;
                        });
                        const remaining = text.slice(lastIdx);
                        if (remaining.length > 0) fragment.appendChild(document.createTextNode(remaining));
                        node.parentNode.replaceChild(fragment, node);
                    }
                } else if (node.nodeType === 1 && node.nodeName !== 'SCRIPT' && node.nodeName !== 'STYLE' && !node.classList.contains('search-highlight')) {
                    Array.from(node.childNodes).forEach(traverse);
                }
            }

            traverse(rightColumn);
        }

        function cleanHighlights() {
            // Find all .search-highlight and replace with inner text
            const marks = document.querySelectorAll('span.search-highlight');
            marks.forEach(mark => {
                const parent = mark.parentNode;
                parent.replaceChild(document.createTextNode(mark.textContent), mark);
                parent.normalize(); // Merge text nodes
            });
        }

        function highlightText(term) {
            cleanHighlights(); // Clean previous first
            if (!term) return;

            const rightColumn = document.getElementById('rightColumn');
            if (!rightColumn) return;

            const regex = new RegExp(`(${term})`, 'gi');

            // Helper to traverse text nodes
            function traverse(node) {
                if (node.nodeType === 3) { // Text Node
                    const text = node.nodeValue;
                    if (regex.test(text)) {
                        const fragment = document.createDocumentFragment();
                        let lastIdx = 0;
                        text.replace(regex, (match, p1, offset) => {
                            // Text before match
                            fragment.appendChild(document.createTextNode(text.slice(lastIdx, offset)));

                            // Match
                            const span = document.createElement('span');
                            span.className = 'search-highlight';
                            span.textContent = match;
                            fragment.appendChild(span);

                            lastIdx = offset + match.length;
                        });
                        // Remaining text
                        fragment.appendChild(document.createTextNode(text.slice(lastIdx)));
                        node.parentNode.replaceChild(fragment, node);
                    }
                } else if (node.nodeType === 1 && node.nodeName !== 'SCRIPT' && node.nodeName !== 'STYLE' && !node.classList.contains('search-highlight')) {
                    // Element Node, recurse
                    Array.from(node.childNodes).forEach(traverse);
                }
            }

            traverse(rightColumn);
        }

        async function navigateWithCode(code) {
            if (!code) return;

            // UI Feedback (Optional)
            document.body.style.cursor = 'wait';

            try {
                const response = await fetch(`/api/navigate?code=${encodeURIComponent(code)}`);
                const result = await response.json();

                if (response.ok && result.status === 'success') {
                    // Update Query Term
                    if (result.current_query) {
                        console.log("Navigation updated query term:", result.current_query);
                        currentSearchTerm = result.current_query;
                    }

                    // 1. Update Right Column
                    const rightCol = document.getElementById('rightColumn');
                    rightCol.innerHTML = result.right;
                    executeScripts(rightCol);

                    // 2. Update Local History
                    const validCode = result.final_code;
                    document.getElementById('mytrackCombo').value = validCode; // Ensure input is synced

                    // Remove if exists
                    recentParagraphs = recentParagraphs.filter(item => item !== validCode);
                    // Add to top
                    recentParagraphs.unshift(validCode);

                    // Limit to 20
                    if (recentParagraphs.length > 20) recentParagraphs.pop();

                    // 3. Refresh Combo
                    updateComboOptions();

                    // Hide Options
                    const trackOptions = document.getElementById('mytrackComboOptions');
                    if (trackOptions) trackOptions.style.display = 'none';

                } else {
                    alert(result.message || "Erro ao navegar.");
                }
            } catch (err) {
                console.error("Navigation error:", err);
                alert("Erro de conexão ao tentar navegar.");
            } finally {
                document.body.style.cursor = 'default';
            }
        }

        function updateComboOptions() {
            const container = document.getElementById('mytrackComboOptions');
            if (!container) return;

            container.innerHTML = '';
            recentParagraphs.forEach(text => {
                const div = document.createElement('div');
                div.className = 'trackCombo-option';
                div.textContent = text;
                div.onclick = function () {
                    navigateWithCode(text);
                };
                container.appendChild(div);
            });
        }

        // Init logic based on 'p' parameter
        document.addEventListener('DOMContentLoaded', () => {
            // Apply Initial Settings (Immediate)
            toggleDarkMode(savedDarkMode);
            toggleBgColors(savedShowBg);
            setHighlightColor(savedHighlight);

            // Apply Highlight Button State
            updateHighlightButtonState();

            // Populate Combo
            updateComboOptions();

            // Setup Combo Box Behavior (Show/Hide)
            const trackInput = document.getElementById('mytrackCombo');
            const trackOptions = document.getElementById('mytrackComboOptions');

            if (trackInput && trackOptions) {
                // Show on focus
                trackInput.addEventListener('focus', () => {
                    if (trackOptions.children.length > 0) {
                        trackOptions.style.display = 'block';
                    }
                });

                // Hide on blur (with delay to allow click on option)
                trackInput.addEventListener('blur', () => {
                    setTimeout(() => {
                        trackOptions.style.display = 'none';
                    }, 200);
                });

                // Handle Enter Key Navigation
                trackInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        const code = trackInput.value.trim();
                        navigateWithCode(code);
                        trackInput.blur();
                    }
                });
            }

            // Set UI Control States
            const dmSwitch = document.getElementById('darkModeSwitch');
            if (dmSwitch) dmSwitch.checked = savedDarkMode;

            const bgSwitch = document.getElementById('bgColorsSwitch');
            if (bgSwitch) bgSwitch.checked = savedShowBg;

            // Set Radio State
            const hlRadio = document.querySelector(`input[name="highlightColor"][value="${savedHighlight}"]`);
            if (hlRadio) hlRadio.checked = true;

            // Setup Save on Close
            const settingsModal = document.getElementById('settingsModal');
            if (settingsModal) {
                settingsModal.addEventListener('hidden.bs.modal', saveSettings);
            }

            // Resizer Logic
            const divisor = document.getElementById('divisor');
            const leftColumn = document.getElementById('leftColumn');
            const rightColumn = document.getElementById('rightColumn');
            const container = document.querySelector('.main-row'); // Parent flex container

            let isResizing = false;

            divisor.addEventListener('mousedown', (e) => {
                isResizing = true;
                divisor.classList.add('resizing');
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none'; // Disable text selection during drag
            });

            document.addEventListener('mousemove', (e) => {
                if (!isResizing) return;

                // Calculate new width relative to container
                const containerRect = container.getBoundingClientRect();
                const containerLeft = containerRect.left;

                // Current Mouse X relative to container
                let pointerRelativeXpos = e.clientX - containerLeft;

                // Constrain minimum widths (e.g., 100px)
                const minWidth = 100;
                const maxWidth = containerRect.width - 100;

                if (pointerRelativeXpos < minWidth) pointerRelativeXpos = minWidth;
                if (pointerRelativeXpos > maxWidth) pointerRelativeXpos = maxWidth;

                // Set left width (Flexbox will adjust right automatically via flex-grow)
                leftColumn.style.width = `${pointerRelativeXpos}px`;
                leftColumn.style.flex = `0 0 ${pointerRelativeXpos}px`; // Fix flex properties
            });

            document.addEventListener('mouseup', () => {
                if (isResizing) {
                    isResizing = false;
                    divisor.classList.remove('resizing');
                    document.body.style.cursor = 'default';
                    document.body.style.userSelect = 'text';
                }
            });

            // Auto-load content based on current_page passed from backend
            const currentPage = "{{ current_page }}";
            const pageRoutes = {
                'indexToc': '/toc',
                'indexSubject': '/subject',
                'indexStudy': '/articles',
                'search': '/search',
                'settings': '/settings'
            };

            if (pageRoutes[currentPage]) {
                // Load initial content without saving (it was just restored)
                // Passing null as pageId to avoid re-saving immediately, or pass currentPage if we want to confirm.
                // Since read_root already restored it, valid.
                loadContent(pageRoutes[currentPage], currentPage);
            }
        });

        async function loadContent(route, pageId = null) {
            try {
                // 1. Fetch Content
                const response = await fetch(route);
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();

                // Update Query Term if present
                if (data.current_query) {
                    console.log("Load Content updated query term:", data.current_query);
                    currentSearchTerm = data.current_query;
                }

                const leftDiv = document.getElementById('leftColumn');
                const rightDiv = document.getElementById('rightColumn');

                if (leftDiv) {
                    leftDiv.innerHTML = data.left;
                    executeScripts(leftDiv);
                }
                if (rightDiv && data.right) {
                    rightDiv.innerHTML = data.right;
                    executeScripts(rightDiv);
                }

                // 2. Update Navbar State
                document.querySelectorAll('.nav-link').forEach(link => {
                    link.classList.remove('active', 'navactive');
                    link.classList.add('navinactive');

                    // Match by exact href call
                    if (link.getAttribute('href') === `javascript:loadContent('${route}', '${pageId}')`) {
                        link.classList.add('active', 'navactive');
                        link.classList.remove('navinactive');
                    }
                });

                // 3. Persist Page State (if pageId provided)
                if (pageId) {
                    await fetch('/api/log_page', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ page_id: pageId })
                    });
                }

            } catch (error) {
                console.error('Error loading content:', error);
                document.getElementById('rightColumn').innerHTML = `<p class="text-danger">Erro ao carregar conteúdo: ${error.message}</p>`;
            }
        }

        function executeScripts(container) {
            const scripts = container.querySelectorAll('script');
            scripts.forEach(oldScript => {
                const newScript = document.createElement('script');
                Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                newScript.textContent = oldScript.textContent;
                oldScript.parentNode.replaceChild(newScript, oldScript);
            });
            // Apply highlights after scripts (like scrolling) have run
            if (container.id === 'rightColumn' || container.querySelector('#rightColumn')) {
                // Wait slightly for any other render
                setTimeout(applyHighlightState, 100);
            }
        }

        function loadDynamicContent(secretString) {
            console.log("Enviando segredo:", secretString);

            // Chama uma rota específica passando a string como parâmetro
            fetch(`/get_node_content?code=${encodeURIComponent(secretString)}`)
                .then(response => {
                    if (!response.ok) throw new Error("Network response was not ok");
                    return response.json();
                })
                .then(data => {
                    // Update Query Term
                    if (data.current_query) {
                        console.log("Dynamic Content updated query term:", data.current_query);
                        currentSearchTerm = data.current_query;
                    }

                    // Atualiza SOMENTE a coluna da direita
                    const rightCol = document.getElementById('rightColumn');
                    rightCol.innerHTML = data.right;
                    // Important: Execute scripts inside the new HTML (e.g. scroll logic)
                    executeScripts(rightCol);
                })
                .catch(error => console.error('Erro na requisição:', error));
        }

        // --- Settings Logic ---
        function openSettingsModal() {
            var myModal = new bootstrap.Modal(document.getElementById('settingsModal'));
            myModal.show();
        }

        function toggleDarkMode(isDark) {
            document.documentElement.setAttribute('data-bs-theme', isDark ? 'dark' : 'light');
        }

        function toggleBgColors(show) {
            if (show) {
                document.body.classList.add('show-bg-colors');
            } else {
                document.body.classList.remove('show-bg-colors');
            }
        }

        function setHighlightColor(color) {
            document.documentElement.style.setProperty('--highlight-color', color);
        }

        async function saveSettings() {
            const highlightColor = document.querySelector('input[name="highlightColor"]:checked')?.value || 'magenta';
            const darkMode = document.getElementById('darkModeSwitch').checked;
            const showBgColors = document.getElementById('bgColorsSwitch').checked;

            const payload = {
                highlight_color: highlightColor,
                dark_mode: darkMode,
                show_bg_colors: showBgColors
            };

            try {
                await fetch('/api/save_settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                console.log("Settings saved.");
            } catch (error) {
                console.error("Error saving settings:", error);
            }
        }
    </script>
</body>

</html>
