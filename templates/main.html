    <script>
        // Init logic based on 'p' parameter
        document.addEventListener('DOMContentLoaded', () => {
            // Resizer Logic
            const divisor = document.getElementById('divisor');
            const leftColumn = document.getElementById('leftColumn');
            const rightColumn = document.getElementById('rightColumn');
            const container = document.querySelector('.main-row'); // Parent flex container

            let isResizing = false;

            divisor.addEventListener('mousedown', (e) => {
                isResizing = true;
                divisor.classList.add('resizing');
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none'; // Disable text selection during drag
            });

            document.addEventListener('mousemove', (e) => {
                if (!isResizing) return;

                // Calculate new width relative to container
                const containerRect = container.getBoundingClientRect();
                const containerLeft = containerRect.left;

                // Current Mouse X relative to container
                let pointerRelativeXpos = e.clientX - containerLeft;

                // Constrain minimum widths (e.g., 100px)
                const minWidth = 100;
                const maxWidth = containerRect.width - 100;

                if (pointerRelativeXpos < minWidth) pointerRelativeXpos = minWidth;
                if (pointerRelativeXpos > maxWidth) pointerRelativeXpos = maxWidth;

                // Set left width (Flexbox will adjust right automatically via flex-grow)
                leftColumn.style.width = `${pointerRelativeXpos}px`;
                leftColumn.style.flex = `0 0 ${pointerRelativeXpos}px`; // Fix flex properties
            });

            document.addEventListener('mouseup', () => {
                if (isResizing) {
                    isResizing = false;
                    divisor.classList.remove('resizing');
                    document.body.style.cursor = 'default';
                    document.body.style.userSelect = 'text';
                }
            });

            // Auto-load content based on current_page passed from backend
            const currentPage = "{{ current_page }}";
            const pageRoutes = {
                'indexToc': '/toc',
                'indexSubject': '/subject',
                'indexStudy': '/articles',
                'search': '/search',
                'settings': '/settings'
            };

            if (pageRoutes[currentPage]) {
                // Load initial content without saving (it was just restored)
                // Passing null as pageId to avoid re-saving immediately, or pass currentPage if we want to confirm.
                // Since read_root already restored it, valid.
                loadContent(pageRoutes[currentPage], currentPage);
            }
        });

        async function loadContent(route, pageId = null) {
            try {
                // 1. Fetch Content
                const response = await fetch(route);
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();

                const leftDiv = document.getElementById('leftColumn');
                const rightDiv = document.getElementById('rightColumn');

                if (leftDiv) {
                    leftDiv.innerHTML = data.left;
                    executeScripts(leftDiv);
                }
                if (rightDiv) {
                    rightDiv.innerHTML = data.right;
                    executeScripts(rightDiv);
                }

                // 2. Update Navbar State
                document.querySelectorAll('.nav-link').forEach(link => {
                    link.classList.remove('active', 'navactive');
                    link.classList.add('navinactive');

                    // Match by exact href call
                    if (link.getAttribute('href') === `javascript:loadContent('${route}', '${pageId}')`) {
                        link.classList.add('active', 'navactive');
                        link.classList.remove('navinactive');
                    }
                });

                // 3. Persist Page State (if pageId provided)
                if (pageId) {
                    await fetch('/api/log_page', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ page_id: pageId })
                    });
                }

            } catch (error) {
                console.error('Error loading content:', error);
                document.getElementById('rightColumn').innerHTML = `<p class="text-danger">Erro ao carregar conteúdo: ${error.message}</p>`;
            }
        }

        function executeScripts(container) {
            const scripts = container.querySelectorAll('script');
            scripts.forEach(oldScript => {
                const newScript = document.createElement('script');
                Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                newScript.textContent = oldScript.textContent;
                oldScript.parentNode.replaceChild(newScript, oldScript);
            });
        }

        function loadDynamicContent(secretString) {
            console.log("Enviando segredo:", secretString);

            // Chama uma rota específica passando a string como parâmetro
            fetch(`/get_node_content?code=${encodeURIComponent(secretString)}`)
                .then(response => {
                    if (!response.ok) throw new Error("Network response was not ok");
                    return response.json();
                })
                .then(data => {
                    // Atualiza SOMENTE a coluna da direita
                    const rightCol = document.getElementById('rightColumn');
                    rightCol.innerHTML = data.right;
                    // Important: Execute scripts inside the new HTML (e.g. scroll logic)
                    executeScripts(rightCol);
                })
                .catch(error => console.error('Erro na requisição:', error));
        }
    </script>
