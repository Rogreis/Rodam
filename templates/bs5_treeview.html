<!-- Controls for testing
<div class="input-group mb-3">
    <input type="text" id="nodeIdInput" class="form-control" placeholder="Node ID (e.g., 1.1)" value="005_001_000">
    <button class="btn btn-outline-secondary" type="button" onclick="toggleNodeById()">Locate Node</button>
</div> -->

<!-- Header -->
<div class="mb-3 p-2 border-bottom">
    <div class="d-flex w-100 justify-content-between align-items-center mb-2">
        <h5 class="mb-0"><i class="bi bi-journal-text"></i> Documentos</h5>
    </div>
    <input type="text" class="form-control form-control-sm" id="input-search-toc"
        placeholder="Filtrar documentos... (Enter)" autocomplete="off">
</div>

<!-- Treeview Container -->
<div id="treeview"></div>

<script>
    var treeData = {{ data | tojson | safe }};

    // Globalize or hoisting safe
    function initTreeview() {
        try {
            var $tree = $('#treeview').treeview({
                data: treeData,
                levels: 2,
                showBorder: false,
                expandIcon: 'bi bi-folder-fill text-warning', // Pasta fechada (amarela)
                collapseIcon: 'bi bi-folder2-open text-warning', // Pasta aberta (amarela)
                emptyIcon: 'bi bi-file-earmark-text text-info', // Documento (ciano)
                highlightSearchResults: false,
                onNodeSelected: function (event, data) {
                    // Navigate to content when node is selected
                    if (data.href && window.navigateWithCode) {
                        let parts = data.href.split('_');
                        if (parts.length === 3) {
                            let cleanRef = `${parseInt(parts[0])}:${parseInt(parts[1])}-${parseInt(parts[2])}`;
                            console.log("Navigating to from Tree:", cleanRef);
                            window.navigateWithCode(cleanRef);
                        }
                    }
                }
            });

            // Initialize Search Logic
            var searchInput = document.getElementById('input-search-toc');
            if (searchInput) {
                searchInput.addEventListener('keydown', function (e) { // Changed to keydown to catch Enter
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        var pattern = searchInput.value;
                        if (pattern === "") {
                            $tree.treeview('clearSearch');
                            $('#treeview .list-group-item').show(); // Garantir que todos voltem a ficar visíveis
                            $tree.treeview('collapseAll', { silent: true });
                            $tree.treeview('expandNode', [0, { levels: 2, silent: true }]); // Reset expansion? logic may vary
                        } else {
                            var options = {
                                ignoreCase: true,
                                exactMatch: false,
                                revealResults: true,
                            };
                            var results = $tree.treeview('search', [pattern, options]);

                            // Logica de Filtro Visual (Esconder nós que não são resultado nem pais de resultados)
                            // 1. Esconder todos os nós visíveis (rendered)
                            var allNodes = $('#treeview .list-group-item');
                            allNodes.hide();

                            // 2. Função recursiva para exibir nó e seus pais
                            var showNodeAndParents = function (node) {
                                var nodeId = node.nodeId;
                                var el = $('#treeview li[data-nodeid="' + nodeId + '"]');
                                el.show();

                                if (node.parentId !== undefined) {
                                    var parent = $tree.treeview('getNode', node.parentId);
                                    showNodeAndParents(parent);
                                }
                            };

                            // 3. Exibir apenas os resultados e seus caminhos
                            results.forEach(function (node) {
                                showNodeAndParents(node);
                            });

                            console.log("Filtered tree. Results:", results);
                        }
                    }
                });

                // Also allow clearing on empty (live feedback or X button in search input usually)
                searchInput.addEventListener('input', function (e) {
                    if (searchInput.value === "") {
                        $tree.treeview('clearSearch');
                    }
                });
            }


            // Auto-select initial node if provided (from Jinja variable)
            const initialNode = "{{ initial_node }}";
            if (initialNode && initialNode !== "None") {
                console.log("Auto-selecting initial node from server:", initialNode);
                // Give a small delay for the tree to fully render
                setTimeout(() => toggleNodeById(initialNode), 500);
            }

        } catch (err) {
            console.error("Ainda há um erro: ", err);
            document.getElementById('treeview').innerHTML =
                '<div class="alert alert-danger">Erro ao carregar o componente Treeview.</div>';
        }
    }

    // Retry mechanism to ensure jQuery and treeview are loaded
    var retryCount = 0;
    function checkAndInit() {
        if ($.fn.treeview) {
            initTreeview();
        } else {
            retryCount++;
            if (retryCount < 10) {
                console.warn("Treeview plugin not yet loaded. Retrying...");
                setTimeout(checkAndInit, 100);
            } else {
                console.error("Treeview plugin failed to load after multiple attempts.");
                document.getElementById('treeview').innerHTML = '<div class="alert alert-danger">Plugin Treeview não disponível.</div>';
            }
        }
    }
    checkAndInit();

    function toggleNodeById(secret_code) {
        if (!secret_code) return;

        let targetHref = secret_code;

        // Conversion Logic: 
        // 120:3-4 -> 120, 3, 4 -> 120_003_000 (Ignore paragraph for node selection if tree only shows sections?)

        const tripletMatch = secret_code.match(/^(\d+)[\.:](\d+)(?:[\-\.:](\d+))?$/);

        if (tripletMatch) {
            const p = parseInt(tripletMatch[1]).toString().padStart(3, '0');
            const s = parseInt(tripletMatch[2]).toString().padStart(3, '0');
            // The third part (paragraph) is usually 000 for tree nodes unless tree goes down to paragraph level
            targetHref = `${p}_${s}_000`;
            console.log(`Converted ${secret_code} to tree ID: ${targetHref}`);
        }

        const tree = $('#treeview').treeview('getEnabled');

        console.log("Procurando por URL:", targetHref);

        // A biblioteca preserva a propriedade 'href' que enviamos do Python
        const targetNode = tree.find(n => n.href === targetHref);

        if (targetNode) {
            // A biblioteca gera um 'nodeId' interno (numérico) que precisamos para os métodos
            const internalNodeId = targetNode.nodeId;

            // 'revealNode' expande a árvore até ao nó
            $('#treeview').treeview('revealNode', [internalNodeId, { silent: false }]);

            // 'expandNode' abre o próprio nó (caso seja uma pasta)
            $('#treeview').treeview('expandNode', [internalNodeId, { levels: 1, silent: false }]);

            // 'selectNode' seleciona o nó visualmente (Silent=True to prevent loop with onNodeSelected -> navigateWithCode)
            $('#treeview').treeview('selectNode', [internalNodeId, { silent: true }]);

            // Rolar até o elemento
            const element = document.querySelector(`li[data-nodeid="${internalNodeId}"]`);
            if (element) element.scrollIntoView({ behavior: "smooth", block: "center" });

        } else {
            console.error("Nó não encontrado (toggleNodeById).");
        }
    }

</script>
