<table class="table table-borderless mb-0">
    <tbody>
        {% for text_left, text_right in paragraphs %}
        <tr>
            <td class="w-50 align-top p-1">
                {{ text_left | safe }}
            </td>

            <td class="w-50 align-top p-1">
                {{ text_right | safe }}
            </td>

        </tr>
        {% endfor %}
    </tbody>
</table>
